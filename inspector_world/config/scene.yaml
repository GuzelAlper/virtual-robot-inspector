# Описание сцены инспекции. Мир Gazebo, текстуры приборов и маршрут
# генерируются из этого файла:  python3 scripts/generate_world.py
#
# Координаты в метрах, углы в радианах. Робот стартует в (0, 0) лицом к +X.
#
# Планировка (вид сверху):
#
#   стартовая зона  ->  коридор с препятствием  ->  цех со станцией(ями)
#   x: -1.5 .. 1.5       x: 1.5 .. 7.0              x: 7.0 .. 12.5
#   y: -1.5 .. 1.5       y: -1.2 .. 1.2             y: -3.0 .. 3.0

scene:
  name: inspection_hall_v1
  spawn: {x: 0.0, y: 0.0, yaw: 0.0}
  wall_height: 1.0
  wall_thickness: 0.1
  rooms:                       # прямоугольники: стены по периметру, проёмы ниже
    - {name: start,    x0: -1.5, y0: -1.5, x1: 1.5,  y1: 1.5}
    - {name: corridor, x0: 1.5,  y0: -1.2, x1: 7.0,  y1: 1.2}
    - {name: hall,     x0: 7.0,  y0: -3.0, x1: 12.5, y1: 3.0}
  openings:                    # проёмы в стенах между помещениями (по оси x = const)
    - {x: 1.5, y0: -1.2, y1: 1.2}
    - {x: 7.0, y0: -1.2, y1: 1.2}
  obstacles:
    - {name: crate_1,  type: box,      x: 4.5, y: 0.55,  size: [0.6, 0.7, 0.6], color: [0.85, 0.45, 0.10]}
    - {name: barrel_1, type: cylinder, x: 8.6, y: -1.6,  radius: 0.3, height: 0.9, color: [0.15, 0.35, 0.75]}

# Станция = стойка со стрелочными приборами. ТЗ: 16 станций × 4 прибора = 64 прибора;
# в первой версии одна тестовая станция, остальные добавляются сюда же.
# pose — центр лицевой плоскости стойки; yaw — направление, куда «смотрят» приборы.
# Прибор: range — шкала (270°, от «7:30» до «4:30»), norm — допустимый диапазон
# (зелёная дуга), value — положение стрелки.
stations:
  - id: ST-01
    pose: {x: 11.5, y: 0.0, yaw: 3.14159265}
    instruments:
      - {id: P-01, title: Манометр,    unit: МПа, range: [0, 1.6],   norm: [0.2, 1.0],    value: 0.62}
      - {id: T-01, title: Термометр,   unit: "°C", range: [0, 120],  norm: [10, 80],      value: 46}
      - {id: P-02, title: Манометр,    unit: бар, range: [0, 10],    norm: [1, 6],        value: 7.8}    # тревога
      - {id: V-01, title: Вакуумметр,  unit: МПа, range: [-0.1, 0],  norm: [-0.08, -0.02], value: -0.05}

instrument_layout:
  spacing: 1.0                 # расстояние между приборами на стойке, м
  panel_center_z: 0.36         # высота центра таблички (камера Go2 ≈ 0.28 м)
  checkpoint_distance: 1.05    # на каком расстоянии перед прибором останавливается робот
